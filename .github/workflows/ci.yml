name: Calendar checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prevent sensitive files in repository
        run: |
          test ! -f .env
          test ! -f .env.local
          test ! -f graph-data.json
          node -e "JSON.parse(require('fs').readFileSync('vercel.json'))"
